<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-labelledby="title desc">
  <title id="title">Сокол — лазурный ас</title>
  <desc id="desc">Оригинальный аркадный биплан: два кремовых крыла, бирюзовый фюзеляж, открытая кабина и звездообразный двигатель. Нос направлен вправо.</desc>
